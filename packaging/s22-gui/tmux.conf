# The Shell app's tabs (D051): foot runs tmux, whose status line sits at the
# top, a row of tabs under the system status bar. Your own tmux.conf (in
# ~/.config/tmux/ or ~/.tmux.conf) is read last and can change any of it.
#
#   Recents, then Right / Left    next / previous tab (Ctrl+Right / Ctrl+Left)
#   Recents, then Up              a new tab, in the same folder (Ctrl+Up)
#   exit, or Ctrl+D               close the tab (the last one closes the Shell)
#   tap a tab / the +             switch to it / a new tab; drag to scroll back
#
# Copy and paste, with the phone's clipboard (wl-copy, wl-paste):
#   Recents, then Down            select mode (Ctrl+Down): the arrows move,
#                                 0 (space) starts the selection, OK copies,
#                                 Back leaves
#   long press, then drag         select with a finger; lifting it copies
#   Recents, then V               paste the clipboard (Ctrl+V: 8 three times)
#
# Home leaves the Shell running; closed some other way, it comes back to the
# same tabs (new-session -A).

set -g default-terminal "tmux-256color"
set -as terminal-features ",foot*:RGB"
set -g escape-time 10			# Back is Esc: no wait after it
set -g history-limit 5000
set -g mouse on
set -g base-index 1
set -g renumber-windows on
set -g automatic-rename on
set -g automatic-rename-format "#{pane_current_command}"

# Copying goes to the phone's clipboard, pasting comes from it
set -g mode-keys vi
set -s copy-command "wl-copy"
set -s set-clipboard off

# The tab row, in the GUI's dark theme
set -g status-position top
set -g status-interval 0
set -g status-justify left
set -g status-style "bg=#1c2228,fg=#9aa0a6"
set -g status-left ""
set -g status-right "#[range=user|new,fg=#4fc3f7,bold]  +  #[norange]"
set -g status-right-length 8
set -g window-status-format " #I #W "
set -g window-status-current-format "#[bg=#2a3f52,fg=#e8eaed,bold] #I #W "
set -g window-status-separator ""
set -g message-style "bg=#2a3f52,fg=#e8eaed"

bind -n C-Right next-window
bind -n C-Left previous-window
bind -n C-Up new-window -c "#{pane_current_path}"
bind -n C-Down copy-mode
bind -T copy-mode-vi Space send -X begin-selection
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel
bind -T copy-mode-vi C-Down send -X cancel
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel
bind -n C-v run-shell "wl-paste -n 2>/dev/null | tmux load-buffer -b clip - && tmux paste-buffer -b clip -d"
# A tap on the +: a new tab; on a tab: that tab
bind -n MouseDown1Status if -F "#{==:#{mouse_status_range},new}" \
	"new-window -c '#{pane_current_path}'" "select-window -t ="

source-file -q ~/.tmux.conf
source-file -q ~/.config/tmux/tmux.conf
