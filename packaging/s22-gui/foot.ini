# foot as the Shell app: looks like the text console (Terminus 8x16 bold,
# the Linux console's colours, black background), with tabs (tmux)
[main]
# Tabs: tmux, its tab row at the top (tmux.conf); the same tabs come back
# if the Shell is closed and opened again
shell=tmux -f /usr/share/s22/tmux.conf new-session -A -s shell
font=Terminus:pixelsize=16:weight=bold
font-bold=Terminus:pixelsize=16:weight=bold
# Selected text goes to the clipboard, not a separate primary selection
selection-target=clipboard
pad=0x0

[cursor]
style=block

[colors-dark]
background=000000
foreground=aaaaaa
regular0=000000
regular1=aa0000
regular2=00aa00
regular3=aa5500
regular4=0000aa
regular5=aa00aa
regular6=00aaaa
regular7=aaaaaa
bright0=555555
bright1=ff5555
bright2=55ff55
bright3=ffff55
bright4=5555ff
bright5=ff55ff
bright6=55ffff
bright7=ffffff
