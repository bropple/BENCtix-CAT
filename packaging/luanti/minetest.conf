# BENCtix-CAT's first settings for Luanti (s22-luanti copies this once;
# Luanti keeps your changes). Settings, Controls changes the keys.
fullscreen = true
# The touchscreen looks around and digs (drag; tap, hold); the keypad moves
touch_controls = true

# The keypad, in game mode (s22-t9d: OK Enter, Call Ctrl, # Tab, * keypad *,
# Speaker Alt, C Backspace). SDL scancodes
# D-pad: walk forward and back, turn
keymap_forward = SYSTEM_SCANCODE_82
keymap_backward = SYSTEM_SCANCODE_81
keymap_camera_yaw_left = SYSTEM_SCANCODE_80
keymap_camera_yaw_right = SYSTEM_SCANCODE_79
# 2 8 look up and down, 4 6 step sideways, 5 jump, 0 sneak
keymap_camera_pitch_up = SYSTEM_SCANCODE_31
keymap_camera_pitch_down = SYSTEM_SCANCODE_37
keymap_left = SYSTEM_SCANCODE_33
keymap_right = SYSTEM_SCANCODE_35
keymap_jump = SYSTEM_SCANCODE_34
keymap_sneak = SYSTEM_SCANCODE_39
# OK dig, Call place, C drop
keymap_dig = KEY_LBUTTON|SYSTEM_SCANCODE_40
keymap_place = KEY_RBUTTON|SYSTEM_SCANCODE_224
keymap_drop = SYSTEM_SCANCODE_42
# 1 3 the previous and next item, # the inventory, * chat (Recents to type)
keymap_hotbar_previous = SYSTEM_SCANCODE_30
keymap_hotbar_next = SYSTEM_SCANCODE_32
keymap_inventory = SYSTEM_SCANCODE_43
keymap_chat = SYSTEM_SCANCODE_85
# 7 fly, 9 fast, Speaker held: Aux1 (fast, or down while flying)
keymap_freemove = SYSTEM_SCANCODE_36
keymap_fastmove = SYSTEM_SCANCODE_38
keymap_aux1 = SYSTEM_SCANCODE_226
# The digits are the keypad's, not the hotbar slots'
keymap_slot1 =
keymap_slot2 =
keymap_slot3 =
keymap_slot4 =
keymap_slot5 =
keymap_slot6 =
keymap_slot7 =
keymap_slot8 =
keymap_slot9 =
keymap_slot10 =
