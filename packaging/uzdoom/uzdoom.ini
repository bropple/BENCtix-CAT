# BENCtix-CAT's first settings for UZDoom (s22-doom copies this once; UZDoom
# fills in the rest and keeps your changes)

[IWADSearch.Directories]
Path=$HOME/Games/doom
Path=$PROGDIR
Path=$HOME/.local/share/games/uzdoom
Path=/usr/share/games/doom

[FileSearch.Directories]
Path=$HOME/Games/doom
Path=$PROGDIR

[GlobalSettings]
# The GPU (Adreno 308) has OpenGL 3.1 and ES 3.0: the GLES backend, in an
# ES context, drawing the 3D view (with our depth clamp patch, D061)
vid_preferbackend=2
gl_es=true
vid_rendermode=4
vid_fullscreen=true
# No mouselook, and no mouse: a finger on the screen would turn the view
freelook=false
use_mouse=false
cl_run=true
# No vsync: with glFinish before each swap (D063) a frame that waited for
# the screen's next refresh held up the next one, so a frame just over
# 16.7 ms took 33 (30 a second). Wayland does not tear
vid_vsync=false
# What the GPU can afford: textures unfiltered (the original look; filtered
# ones also flickered here), no dynamic lights or sprite shadows, full
# resolution (half gave only a quarter more frames: the GPU's time goes to
# what it draws, not to pixels)
gl_texture_filter=0
gl_texture_filter_anisotropic=1
r_dynlights=false
autoloadlights=false
gl_light_sprites=false
gl_light_particles=false
r_actorspriteshadow=0
vid_scalefactor=1

# The keypad (Options, Controls changes them). UZDoom keeps keys per game
# family, so each has the same: Doom (also Freedoom, Hacx, Harmony),
# Heretic, Hexen, Strife and Chex Quest
[Doom.Bindings]
UpArrow=+forward
DownArrow=+back
LeftArrow=+left
RightArrow=+right
2=+forward
8=+back
4=+moveleft
6=+moveright
Enter=+attack
5=+attack
Ctrl=+attack
Backspace=+use
0=+use
1=weapprev
3=weapnext
7=quicksave
9=quickload
Tab=togglemap
KP*=toggle cl_run
Alt=+strafe

