# BENCtix-CAT: the End key is the power key. A tap must not power off the
# phone; a long press does, as on a phone.
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=poweroff
# The lid only turns the main display off (s22-lidd); suspend comes later
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
