# BENCtix-CAT (D040): "Media", the default output, a loopback into the
# loudspeaker. Its volume is the media volume (s22-wm's volume keys), so it
# leaves rings and notifications alone: s22-play sends those to the
# loudspeaker directly, at the ring and notification volume.
#
# Mono (D060): the phone has one loudspeaker, so Media is a mono sink. What
# apps play in stereo is mixed down to it (both channels, not the left
# alone), and the mono goes to both of the amplifier's channels. Media only
# ever plays into the loudspeaker; a Bluetooth output takes over as the
# default, in stereo, while it is connected (D062).
context.modules = [
  {
    name = libpipewire-module-loopback
    args = {
      node.description = "Media"
      capture.props = {
        node.name = "s22.media"
        media.class = "Audio/Sink"
        audio.position = [ MONO ]
        priority.session = 2000
        priority.driver = 2000
      }
      playback.props = {
        node.name = "s22.media.output"
        node.passive = true
        audio.position = [ MONO ]
        target.object = "s22.speaker"
      }
    }
  }
]
