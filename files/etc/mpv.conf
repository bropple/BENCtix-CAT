# BENCtix-CAT (D032): Venus decodes, the GPU scales and converts.
# v4l2m2m-copy: mpv's dmabuf outputs do not take Venus' frames directly.
hwdec=v4l2m2m-copy
vo=gpu
gpu-context=wayland
# Adreno 308: mpv's default scalers are too heavy for 30 fps; bilinear is not
profile=fast
# Fill the screen
fs=yes
