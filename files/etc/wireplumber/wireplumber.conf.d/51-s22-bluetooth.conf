# BENCtix-CAT (D062): music out to Bluetooth speakers and headphones.
#
# WirePlumber only runs its Bluetooth monitor while the user's login seat
# is "active", and the GUI's user runs as a service with no login session,
# so it never was: the phone offered no A2DP source, and an audio device
# connected, found nothing and left. Seat monitoring is off here.
wireplumber.profiles = {
  main = {
    monitor.bluez.seat-monitoring = disabled
  }
}

monitor.bluez.properties = {
  # Music out only. Calls stay on the modem's audio path, so the phone is
  # never a headset gateway (HFP/HSP) to a speaker
  bluez5.roles = [ a2dp_source ]
  # SBC at its higher bitrate where the device takes it; better codecs
  # (AAC, aptX, LDAC) are used when both sides have them
  bluez5.enable-sbc-xq = true
}

# A Bluetooth output, while it is there, is the default: above Media
# (priority 2000, 50-s22-media.conf), so the music player, the browser and
# the volume keys (@DEFAULT_AUDIO_SINK@) follow it, in stereo, and fall
# back to Media when it goes
monitor.bluez.rules = [
  {
    matches = [ { node.name = "~bluez_output.*" } ]
    actions = {
      update-props = {
        priority.session = 3000
        priority.driver = 3000
      }
    }
  }
]
