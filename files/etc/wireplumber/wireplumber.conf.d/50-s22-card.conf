# BENCtix-CAT (D040): the phone's sound card through PipeWire.
# The card's output is "s22.speaker" (s22-play and the Media sink find it by
# that name). 16-bit: in S24_LE, what PipeWire picks, the audio DSP plays
# ~48 dB too quiet, as if the 24 bits sat at the top of the 32. 48 kHz as
# the card runs. It suspends after 5 s idle so the audio DSP can sleep.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.*" } ]
    actions = {
      update-props = {
        node.name = "s22.speaker"
        node.description = "Loudspeaker"
        audio.format = "S16LE"
        audio.rate = 48000
        session.suspend-timeout-seconds = 5
      }
    }
  }
]
